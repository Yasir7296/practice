# Fixed Deploy to Staging - This should work!
name: Deploy to Staging Server

on:
  push:
    branches:
      - staging

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚀 Starting Staging Deployment
        run: echo "Deploying to staging server..."
      
      # FIXED SSH Setup - This is the corrected version!
      - name: 🔑 Setup SSH Key
        run: |
          # Create SSH directory
          mkdir -p ~/.ssh
          
          # Add the private key
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          
          # Fix permissions (VERY IMPORTANT!)
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_rsa
          
          # Add server to known hosts
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
          
          # Create SSH config for easier connection
          cat >> ~/.ssh/config << 'SSHCONFIG'
          Host production-server
            HostName ${{ secrets.SERVER_IP }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/id_rsa
            IdentitiesOnly=yes
          SSHCONFIG
      
      # Test SSH connection first
      - name: 🔌 Test SSH Connection
        run: |
          echo "Testing connection to server..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "echo '✅ SSH connection successful!'"
      
      - name: 📥 Pull Staging Code on Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            # Go to staging folder
            cd /home/ubuntu/Staging/stag/practice
            
            # Pull the latest staging code
            git fetch origin
            git checkout staging
            git pull origin staging
            
            echo "✅ Staging code updated successfully!"
          EOF
      
      - name: 🔄 Restart Staging Container
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            # Find and restart staging container
            # Method 1: Try docker-compose
            if [ -f /home/ubuntu/Staging/docker-compose.yml ]; then
              cd /home/ubuntu/Staging
              docker-compose restart
            else
              # Method 2: Try direct docker restart
              # Replace 'staging' with your actual container name
              docker restart $(docker ps -q -f name=staging) || echo "Please update container name"
            fi
            
            echo "✅ Staging container restarted!"
          EOF
      
      - name: 🎉 Deployment Complete
        run: echo "Staging deployment completed successfully!"
